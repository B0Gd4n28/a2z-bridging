<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — A2Z Bridging</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--navy-950:#0d142e;--navy-900:#14204a;--navy-100:#dde4f5;--brand-700:#b32d1f;--brand-600:#ce3a2a;--brand-100:#fadeda;--mist:#eef2fa;}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--navy-900);background:var(--mist);line-height:1.5;-webkit-font-smoothing:antialiased;}
h1{font-family:'Montserrat',Arial,sans-serif;margin:0;line-height:1.2;font-size:28px;font-weight:700;}
p{margin:0;}
a{text-decoration:none;}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 20px;}
.card{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(13,20,46,.12);padding:40px;max-width:460px;text-align:center;}
.checkmark-circle{width:64px;height:64px;border-radius:50%;background:#12AA67;position:relative;margin:0 auto;}
.checkmark{box-sizing:unset;position:absolute;transform:rotate(45deg);left:24px;top:32px;height:18px;width:8px;border-bottom:3px solid #fff;border-right:3px solid #fff;}
h1{margin-top:22px;}
.lead{margin-top:14px;color:rgba(20,32,74,.6);line-height:1.6;}
.ctas{margin-top:28px;display:flex;flex-direction:column;gap:12px;}
@media(min-width:420px){.ctas{flex-direction:row;justify-content:center;}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;font-size:14px;font-weight:600;padding:12px 22px;cursor:pointer;border:none;}
.btn-primary{background:var(--brand-600);color:#fff;}
.btn-outline{border:1px solid var(--navy-100);color:var(--navy-900);background:#fff;}
.hours{margin-top:28px;font-size:12px;color:rgba(20,32,74,.5);}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="checkmark-circle"><div class="checkmark"></div></div>
    <h1>Thank You — We've Got Your Enquiry</h1>
    <p class="lead">A named advisor will call you back shortly — typically within one business hour during office hours (Mon–Fri, 9:00–18:00).</p>
    <div class="ctas">
      <a href="tel:02077800130" class="btn btn-primary">Call Now</a>
      <a href="https://a2zbridging.co.uk" class="btn btn-outline">Back to Homepage</a>
    </div>
    <p class="hours">Office hours: Mon–Fri, 9:00–18:00</p>
  </div>
</div>

<!-- TODO (Harsh): insert GA4 / GTM conversion tag here -->

</body>
</html>
